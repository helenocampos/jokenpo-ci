name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # o SonarQube usa o histórico para achar o código novo

      - name: Instalar o Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e testar
        run: mvn -B test

      - name: Gate de cobertura (JaCoCo)
        run: mvn -B jacoco:check

      - name: Gate de mutação (PIT)
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      # Num fork sem o secret SONAR_TOKEN, este passo é pulado.
      - name: Quality gate (SonarQube Cloud)
        if: env.SONAR_TOKEN != ''
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true

      # Só chega aqui o código que passou por todos os gates.
      - name: Empacotar
        run: mvn -B package -DskipTests

      - name: Guardar o pacote
        uses: actions/upload-artifact@v7
        with:
          name: jokenpo-jar
          path: target/*.jar

      # Os relatórios são guardados mesmo quando um gate falha, para que se
      # possa ver o motivo.
      - name: Guardar os relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            target/site/jacoco/
            target/pit-reports/
